name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Lint, Test & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Linting (eslint .)
        run: npm run lint

      - name: Committed Secrets Scan
        run: npm run check:secrets

      - name: Unit & Invariant Property Tests (Vitest)
        run: npm test

      - name: Differential Oracle Test (OCCT vs FreeCAD)
        env:
          SKIP_FREECAD: '1'
        run: npm run test:oracle

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-Browser E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
